<title>Dustlight Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed painted world; menus float on the left like a rally roadbook, HUD hugs the corners. Single dusk look. */
:root{
  --ink:#191726; --ink-soft:rgba(25,23,38,.58); --ink-line:rgba(244,236,220,.14);
  --paper:#f4ecdc; --paper-dim:rgba(244,236,220,.62); --paper-faint:rgba(244,236,220,.32);
  --sun:#f7b27a; --mist:#9ec9c4; --rose:#e98f8a; --good:#a6dcae;
  --gold:#f2cf73; --silver:#d3dae6; --bronze:#d69c6c;
  --f-display:'Italiana','Didot','Bodoni 72',Georgia,serif;
  --f-ui:'Jost','Futura','Century Gothic','Avenir Next',sans-serif;
  --f-num:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#game,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{visibility:hidden}
body.racing #gl{visibility:visible}
.tilt{position:fixed;left:0;right:0;pointer-events:none;z-index:2;backdrop-filter:blur(3.5px);-webkit-backdrop-filter:blur(3.5px)}
#tilt-top{top:0;height:24%;-webkit-mask-image:linear-gradient(#000 0%,transparent 100%);mask-image:linear-gradient(#000 0%,transparent 100%)}
#tilt-bot{bottom:0;height:22%;-webkit-mask-image:linear-gradient(transparent 0%,#000 100%);mask-image:linear-gradient(transparent 0%,#000 100%)}
body.no-tilt .tilt{display:none}
button{font-family:var(--f-ui);color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* ---------- menus ---------- */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:clamp(16px,4vh,44px);
  padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw);overflow-y:auto;overflow-x:hidden;
  animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.brand{font-family:var(--f-display);font-size:clamp(54px,11vw,150px);line-height:.86;letter-spacing:.02em;margin:0;font-weight:400;text-wrap:balance;
  text-shadow:0 0 60px rgba(247,178,122,.35)}
.brand em{display:block;font-family:var(--f-ui);font-style:normal;font-weight:300;font-size:.19em;letter-spacing:.62em;text-transform:uppercase;margin:.5em 0 0 .2em;color:var(--sun)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--paper-dim);font-weight:500}
.h2{font-family:var(--f-display);font-size:clamp(34px,5vw,58px);margin:.1em 0 .25em;font-weight:400;line-height:1;text-wrap:balance}
.title-wrap{margin:auto 0 0;display:flex;flex-direction:column;gap:28px;max-width:760px}
.press{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:var(--paper);opacity:.85;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.menu-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-width:420px}
.mi{display:flex;align-items:baseline;gap:16px;background:none;border:0;text-align:left;padding:10px 0;font-size:clamp(22px,3vw,30px);font-weight:300;letter-spacing:.06em;color:var(--paper-dim);transition:color .2s, transform .2s}
.mi small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--paper-faint);font-weight:500}
.mi:hover,.mi:focus-visible{color:var(--paper);transform:translateX(6px)}
.mi:hover::before,.mi:focus-visible::before{content:'';width:22px;height:1px;background:var(--sun);align-self:center;margin-right:-6px}
.wallet{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--f-num);font-size:13px;color:var(--paper-dim);margin-top:auto;padding-top:24px}
.wallet b{color:var(--paper);font-weight:500}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.back{background:none;border:1px solid var(--ink-line);border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--paper-dim)}
.back:hover{color:var(--paper);border-color:var(--paper-faint)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--ink-line);color:var(--paper-dim);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.panel{background:var(--ink-soft);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid var(--ink-line);border-radius:18px;padding:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;font-size:13px;letter-spacing:.12em;color:var(--paper-dim)}
.tab.on{border-color:var(--sun);color:var(--paper)}
.tab.locked{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--ink-soft);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ink-line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--paper);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--paper-faint);transform:translateY(-2px)}
.card.sel{border-color:var(--sun)}
.card.locked{opacity:.55}
.card .t{font-size:19px;font-weight:400;letter-spacing:.02em}
.card .sub{font-size:12px;color:var(--paper-dim);letter-spacing:.06em}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.card .num{position:absolute;top:12px;right:14px;font-family:var(--f-num);font-size:11px;color:var(--paper-faint)}
.medal{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.m3{background:var(--gold)}.m2{background:var(--silver)}.m1{background:var(--bronze)}.m0{background:transparent;border:1px dashed var(--paper-faint)}
.best{font-family:var(--f-num);font-size:12px;color:var(--paper-dim);display:flex;align-items:center;gap:8px}
.swatch{width:100%;height:58px;border-radius:10px;overflow:hidden;position:relative}
.swatch canvas{width:100%;height:100%;display:block}
.cta{background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:13px 26px;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 8px 30px rgba(247,178,122,.25)}
.cta:hover{filter:brightness(1.06)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.ghostbtn{background:none;border:1px solid var(--paper-faint);border-radius:999px;padding:12px 22px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.stat{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.bar{height:6px;border-radius:6px;background:rgba(244,236,220,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--paper);border-radius:6px}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:6px}
.stat span{font-family:var(--f-num);text-align:right;color:var(--paper);letter-spacing:0}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ink-line)}
.part .pn{font-size:15px}
.part .pd{font-size:12px;color:var(--paper-dim)}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:5px;border-radius:3px;background:rgba(244,236,220,.14)}
.pips i.on{background:var(--sun)}
.buy{background:none;border:1px solid var(--sun);color:var(--paper);border-radius:999px;padding:6px 12px;font-family:var(--f-num);font-size:12px;white-space:nowrap}
.buy[disabled]{border-color:var(--ink-line);color:var(--paper-faint);cursor:not-allowed}
.carview{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:14px;display:block;background:rgba(0,0,0,.12)}
.liveries{display:flex;gap:8px;flex-wrap:wrap}
.liv{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;overflow:hidden;display:flex}
.liv span{flex:1}
.liv.on{border-color:var(--paper)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ink-line);font-size:15px;flex-wrap:wrap}
.opt small{display:block;color:var(--paper-dim);font-size:12px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--ink-line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 13px;font-size:12px;letter-spacing:.1em;color:var(--paper-dim)}
.seg button.on{background:var(--paper);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--paper-dim)}
.keys kbd{font-family:var(--f-num);font-size:11px;border:1px solid var(--ink-line);border-radius:6px;padding:2px 7px;color:var(--paper);white-space:nowrap}
.muted{color:var(--paper-dim);font-size:13px;line-height:1.55;max-width:62ch}
.lockline{font-size:12px;color:var(--sun);letter-spacing:.04em}
.cols{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.res-time{font-family:var(--f-num);font-size:clamp(44px,8vw,84px);font-weight:400;letter-spacing:-.02em;line-height:1}
.res-medal{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.res-medal .medal{width:28px;height:28px}
.tlist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;font-family:var(--f-num);font-size:13px;color:var(--paper-dim);max-width:380px}
.tlist b{color:var(--paper);font-weight:400}
.unlock{border:1px solid var(--sun);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:14px}
.overlay-center{margin:auto;max-width:520px;width:100%}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--rose)}
.danger{background:none;border:1px solid var(--rose);color:var(--rose);border-radius:999px;padding:7px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;font-family:var(--f-ui)}
#hud .tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 14px rgba(10,8,20,.55)}
#h-stage{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--paper-dim)}
#h-time{font-family:var(--f-num);font-size:clamp(26px,3.4vw,40px);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#h-split{font-family:var(--f-num);font-size:14px;min-height:18px;transition:opacity .4s}
#h-split.good{color:var(--good)}#h-split.bad{color:var(--rose)}
#h-sub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-dim)}
#h-notes{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-start}
.note{display:flex;align-items:center;gap:10px;background:rgba(25,23,38,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--ink-line);border-radius:14px;padding:8px 14px 8px 10px;transition:opacity .25s}
.note svg{width:34px;height:34px;flex:none}
.note .g{font-family:var(--f-num);font-size:26px;line-height:1}
.note .w{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);max-width:120px;line-height:1.3}
.note.next{transform:scale(.78);transform-origin:left top;opacity:.6}
#h-map{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:150px;height:150px;opacity:.92}
#h-gauge{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:190px;height:120px}
#hud .bl{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;width:min(260px,40vw)}
#h-surf{display:flex;gap:6px;flex-wrap:wrap}
.prog{height:4px;border-radius:4px;background:rgba(244,236,220,.16);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--paper);border-radius:4px}
.prog b{position:absolute;top:-3px;width:2px;height:10px;background:var(--gold);border-radius:2px}
#h-center{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(60px,12vw,150px);text-shadow:0 0 50px rgba(247,178,122,.5);pointer-events:none;white-space:nowrap}
#h-msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:13px;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 14px rgba(10,8,20,.6);white-space:nowrap;transition:opacity .4s}
#h-pause{position:absolute;pointer-events:auto;top:calc(172px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;background:rgba(25,23,38,.45);border:1px solid var(--ink-line);font-family:var(--f-num);font-size:12px;letter-spacing:.05em}
@media (max-width:640px){
  #h-map{width:96px;height:96px}
  #h-pause{top:calc(118px + env(safe-area-inset-top,0px))}
  #h-gauge{width:140px;height:90px;bottom:auto;top:calc(160px + env(safe-area-inset-top,0px))}
  #h-notes{top:calc(90px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));transform:none}
  .note .w{max-width:90px}
  .note.next{display:none}
  #hud .bl{bottom:calc(122px + env(safe-area-inset-bottom,0px))}
}

/* ---------- touch ---------- */
#touch{position:fixed;inset:auto 0 0 0;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#touch .grp{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.tb{width:70px;height:70px;border-radius:50%;background:rgba(25,23,38,.35);border:1px solid rgba(244,236,220,.25);color:var(--paper);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tb.on{background:rgba(247,178,122,.45)}
.tb.big{width:84px;height:84px}
.tb.sm{width:58px;height:58px}
@media (max-width:640px){.tb{width:56px;height:56px;font-size:10px}.tb.big{width:68px;height:68px}.tb.sm{width:48px;height:48px}#touch .grp{gap:7px}}

/* ---------- phone pedals, tilt gauge, rotate prompt ---------- */
.pedal{position:relative;width:96px;height:148px;border-radius:16px 16px 22px 22px;border:1px solid rgba(244,236,220,.28);background:linear-gradient(180deg,rgba(44,40,62,.5),rgba(20,18,32,.62));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper);font-size:10px;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:flex-end;justify-content:center;padding:0 0 12px;transform-origin:50% 100%;transition:transform .06s,background .12s;touch-action:none}
.pedal b{position:absolute;left:14px;right:14px;top:14px;bottom:34px;border-radius:9px;background:repeating-linear-gradient(180deg,rgba(244,236,220,.24) 0 3px,transparent 3px 11px);pointer-events:none}
.pedal span,.hbrake span{pointer-events:none}
.pedal.gas{width:84px;height:172px}
.pedal.brake{width:116px;height:136px}
.pedal.on{transform:perspective(320px) rotateX(16deg) scale(.97)}
.pedal.gas.on{background:linear-gradient(180deg,rgba(247,178,122,.6),rgba(205,122,70,.55))}
.pedal.brake.on{background:linear-gradient(180deg,rgba(232,112,100,.6),rgba(170,60,60,.55))}
.hbrake{width:64px;height:118px;border-radius:32px;border:1px solid rgba(244,236,220,.28);background:rgba(25,23,38,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper);font-size:10px;letter-spacing:.18em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 0;gap:8px;touch-action:none;transition:background .1s}
.hbrake b{width:10px;flex:1;border-radius:5px;background:linear-gradient(rgba(244,236,220,.6),rgba(244,236,220,.2));transition:transform .08s;transform-origin:50% 100%;pointer-events:none}
.hbrake.on{background:rgba(247,178,122,.48)}.hbrake.on b{transform:scaleY(.6)}
#touch .grp.lft,#touch .grp.rgt{align-items:flex-end}
.steerbtns{display:flex;gap:10px}
body:not(.tiltsteer) .tiltonly{display:none}
body.tiltsteer .btnonly,body.tiltsteer .steerbtns{display:none}
#tiltmeter{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(200px,26vw);height:4px;transform:translateX(-50%);background:rgba(244,236,220,.16);border-radius:4px;display:none}
#tiltmeter::after{content:'';position:absolute;left:50%;top:-5px;width:1px;height:14px;background:rgba(244,236,220,.45)}
#tiltmeter i{position:absolute;top:-4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--paper);box-shadow:0 0 10px rgba(247,178,122,.6)}
#tiltmeter.dead i{background:var(--rose)}
body.tiltsteer #tiltmeter{display:block}
#rotate{position:fixed;inset:0;z-index:60;background:rgba(16,12,26,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:var(--paper)}
#rotate p{margin:10px 0 0;font-size:17px;letter-spacing:.06em}
#rotate small{color:var(--paper-dim);font-size:13px}
#rotate .phone{width:52px;height:92px;border:3px solid var(--paper);border-radius:12px;position:relative;animation:dl-rot 2.6s ease-in-out infinite}
#rotate .phone i{position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--paper)}
@keyframes dl-rot{0%,22%{transform:rotate(0)}50%,78%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
/* landscape phones: the pedals own the bottom corners, so the gauges move up */
@media (pointer:coarse) and (orientation:landscape) and (max-height:540px){
  #h-map{width:84px;height:84px}
  #h-pause{top:calc(14px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 96px)}
  #h-gauge{width:128px;height:81px;bottom:auto;top:calc(104px + env(safe-area-inset-top,0px))}
  #hud .bl{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px));width:min(200px,26vw)}
  #h-time{font-size:26px}
  #h-notes{top:calc(10px + env(safe-area-inset-top,0px))}
  .note{padding:6px 10px 6px 8px}.note svg{width:28px;height:28px}.note .g{font-size:22px}
  .pedal.gas{height:min(172px,44vh)}.pedal.brake{height:min(136px,36vh)}.hbrake{height:min(118px,31vh)}
  #touch{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
/* the same layout when the game is turned sideways inside an upright page */
body.forceland #h-map{width:84px;height:84px}
body.forceland #h-pause{top:calc(14px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 96px)}
body.forceland #h-gauge{width:128px;height:81px;bottom:auto;top:calc(104px + env(safe-area-inset-top,0px))}
body.forceland #hud .bl{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px));width:min(200px,26vw)}
body.forceland #h-time{font-size:26px}
body.forceland #h-notes{top:calc(10px + env(safe-area-inset-top,0px))}
body.forceland .note{padding:6px 10px 6px 8px}
body.forceland .note svg{width:28px;height:28px}

const DS = 2; // metres between track samples

function splineCR(P, closed, step) {

// resample to uniform spacing and compute frames

  ctx.translate(0, 0); ctx.rotate(Math.PI / 2); ctx.scale(.02, .02); ctx.fillStyle = '#25202c'; ctx.font = '600 23px Jost, Futura, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(opts.num ?? spec.num), 0, 1.5);
  ctx.restore(); xreset(ctx);
  // rear wing: posts and a blade above the boot
  if (s.wing) {
    const hi = s.wing >= 2, wu = -G3.hl + (s.wing >= 3 ? .22 : hi ? .3 : .12), wz = zt + (s.wing >= 3 ? .34 : hi ? .24 : .05), ww = (s.wing >= 3 ? G3.hw * 1.0 : G3.hw * .84);

}

// ---------- mini-map ----------
function buildMinimap() {
  const T = S.T, c = mkCanvas(300, 300), x = c.getContext('2d'), sc = 260 / Math.max(T.W, T.H);
  S.mm = { c, sc, ox: (300 - T.W * sc) / 2, oy: (300 - T.H * sc) / 2 };
  x.translate(S.mm.ox, S.mm.oy); x.scale(sc, sc);
  x.lineJoin = x.lineCap = 'round';
  x.beginPath(); for (let i = 0; i < T.n; i++) i ? x.lineTo(T.px[i], T.py[i]) : x.moveTo(T.px[i], T.py[i]); if (T.closed) x.closePath();
  x.strokeStyle = 'rgba(25,23,38,.55)'; x.lineWidth = 9 / sc; x.stroke();
  x.strokeStyle = 'rgba(244,236,220,.85)'; x.lineWidth = 3.2 / sc; x.stroke();
  if (!T.closed) { x.fillStyle = '#f2cf73'; x.beginPath(); x.arc(T.px[T.n - 1], T.py[T.n - 1], 6 / sc, 0, TAU); x.fill(); }
}

const GLSL_LIGHT = `
uniform float uDark; uniform vec3 uAmb;
uniform vec4 uL[16]; uniform vec3 uLc[16]; uniform int uLn;
uniform vec4 uHead; uniform float uHeadOn;

const VS_GROUND = `#version 300 es
in vec2 aPos; uniform mat4 uM; out vec2 vW;
void main() { vW = aPos; gl_Position = uM * vec4(aPos, 0., 1.); }`;

const FS_TERRAIN = `#version 300 es

uniform vec3 uWaterS, uWaterD, uFoam, uSky, uSunC;

const VS_ROAD = `#version 300 es
in vec2 aPos; in vec2 aUV; in float aSurf; in float aMask; in vec2 aN;

void main() { vW = aPos; vUV = aUV; vSurf = int(aSurf + .5); vMask = aMask; vN = aN; gl_Position = uM * vec4(aPos, 0., 1.); }`;

const VS_RAMP = `#version 300 es
in vec2 aPos; in vec2 aUV; in float aSurf; in float aMask; in vec2 aN; in float aZ;

const VS_DECOR = `#version 300 es
in vec2 aBase; in vec2 aCorner; in float aSize; in float aTile; in vec3 aCol; in float aFlat; in float aRot;
uniform mat4 uM; uniform vec2 uRight; uniform float uTiles, uTime; uniform vec2 uWind;
out vec2 vUV; out vec3 vC; out vec2 vW;
void main() {

const FS_DECOR = `#version 300 es
precision highp float;

${GLSL_LIGHT}
void main() { vec4 t = texture(uAtlas, vUV); if (t.a < .35) discard; o = vec4(lit(vC * t.rgb * 1.9, vW), 1.); }`;

const VS_SOFT = `#version 300 es
in vec2 aPos; in vec2 aLoc; in vec4 aCol; in vec2 aP;
uniform mat4 uM; out vec2 vL; out vec4 vC; out vec2 vP; out vec2 vW;
void main() { vL = aLoc; vC = aCol; vP = aP; vW = aPos; gl_Position = uM * vec4(aPos, 0., 1.); }`;
const FS_SOFT = `#version 300 es
precision highp float;
in vec2 vL; in vec4 vC; in vec2 vP; in vec2 vW; out vec4 o; uniform float uMask;
${GLSL_LIGHT}
void main() {

const VS_SKID = `#version 300 es

function resetCar() {

  else if (RACE.st === 'run' || RACE.st === 'countdown') { RACE.prevSt = RACE.st; RACE.st = 'paused'; UI.pause(); AUD.ac && AUD.ac.suspend(); }
}
function quitRace() { cam.roll = 0; applyCamRoll(0); const tb = document.getElementById('tilt-bot'); if (tb) tb.style.backdropFilter = tb.style.webkitBackdropFilter = ''; cam.blurPx = 0; AUD.stopEngine(); if (AUD.ac) AUD.ac.resume(); RACE = null; GAME.mode = 'menu'; UI.hud(false); }

    const prev = Math.ceil(RC.cd - .6);
    RC.cd -= dt;
    const now = Math.ceil(RC.cd - .6);
    if (now !== prev && now >= 0 && now < 3) { AUD.beep(false); document.getElementById('h-center').textContent = String(now + 1); }
    if (RC.cd <= .6 && RC.st === 'countdown') { RC.st = 'run'; AUD.beep(true); document.getElementById('h-center').textContent = 'Go'; setTimeout(() => { const el = document.getElementById('h-center'); if (el) el.textContent = ''; }, 700); }

    if (car.shiftEv) { if (car.shiftEv === -2) { AUD.deny(); hudMsg('Too fast for that gear', .9); } }

const WHOOSH = { tree: 2, tpole: 1, slamp: 1, stake: 1, chev: 1, jpost: 1, jboard: 1, sign: 1, pole: 1, lamp: 1, house: 2, mill: 2, pump: 1, logs: 2, hay: 1, rock: 1 };
function passBys(car, Wd) {

  Wd.query(car.x, car.y, 11, o => {
    const kind = WHOOSH[o.k]; if (!kind || (o.k === 'tree' && o.h < 2.5) || (o.k === 'rock' && o.h < 1.2)) return;
    const dx = o.x - car.x, dy = o.y - car.y, d = dx * vx + dy * vy, l = dx * -vy + dy * vx, prev = o._pb, fresh = now - (o._pbT || -9) < .3;

    const al = Math.abs(l) - (o.cr || o.r || 0) * .6; if (al > 7.5) return;
    if (now - (AUD.lastWh || 0) < .05) return; AUD.lastWh = now;
    AUD.whoosh(clamp(l / 5, -1, 1) * .85, Math.min(.11, (sp - 11) * .0045) * (1 - al / 8.5) * (kind === 2 ? 1.25 : 1), kind === 2);

function showSplit(delta, label) {

  el.className = delta == null ? '' : delta <= 0 ? 'good' : 'bad';
  el.style.opacity = 1; clearTimeout(showSplit.tm); showSplit.tm = setTimeout(() => { el.style.opacity = 0; }, 3200);
}

function finishRace() {
  const RC = RACE; if (RC.st === 'done') return;
  RC.st = 'done';
  const time = Math.round((RC.t + RC.pen) * 100) / 100, ev = RC.ev;
  if (RC.rally) {
    RC.result = { ...rallyStageDone(time, RC.refT || time, RC.car), time, rally: true, ev, resets: RC.resets };
    if (RC.result.done && RC.result.pos <= 3) AUD.fanfare(); else AUD.beep(true);
    document.getElementById('h-center').textContent = fmtTime(time);
    return;
  }
  let medal = 0;
  if (RC.targets) medal = time <= RC.targets[2] ? 3 : time <= RC.targets[1] ? 2 : time <= RC.targets[0] ? 1 : 0;
  if (ev.type === 'roam') medal = 0;
  const prev = SV.ev[ev.id] || null, isBest = !prev || !prev.best || time < prev.best;
  let pay = ev.type === 'roam' ? 400 : MEDAL_PAY[medal] * (1 + .3 * ((ev.cls || CAR[RC.carId].cls) - 1));
  if (ev.free) pay *= .5;
  if (prev && (prev.medal || 0) >= medal && !ev.free) pay *= .5;
  pay = Math.round(pay / 10) * 10;
  SV.credits += pay;
  const prevMedal = prev ? prev.medal || 0 : 0;
  if (!ev.free || ev.type !== 'roam') SV.ev[ev.id] = { best: isBest ? time : prev.best, medal: Math.max(prevMedal, medal), splits: isBest ? RC.splits.slice() : (prev && prev.splits) || [], car: isBest ? RC.carId : prev && prev.car };
  if (isBest && ev.type !== 'roam') saveGhost(ev.id, { d: RC.rec, car: RC.carId, liv: RC.liv, t: time });
  const champWas = ev.champ ? champDone(ev.champ) : true;
  const fresh = checkUnlocks();

function rallyOpen(r) { return SV.dev || CARS.some(c => c.cls === r.cls && SV.cars.includes(c.id)); }

// a new rally: nine rivals with their own pace, cars from the class and a little day-to-day form
function rallyNew(rid, carId) {
  const r = RALLY[rid], pool = RIVALS.slice().sort(() => Math.random() - .5).slice(0, 9), cars = CARS.filter(c => c.cls === r.cls);
  const rivals = pool.map((d, i) => ({ ...d, car: cars[(i + 1) % cars.length].id, pace: .975 + i * .016 + (Math.random() - .5) * .02, form: (Math.random() - .5) * .01 }));
  SV.rally = { id: rid, car: carId, stage: 0, rivals, times: rivals.map(() => []), my: [], dm: null, dents: [], refs: [], done: false, started: Date.now() };
  writeSave();
}

// the field's times on the stage just driven, from the reference pace of the stage
function rallyFieldTimes(ref) {
  const R = SV.rally;
  R.rivals.forEach((d, i) => {
    const prev = R.times[i];
    if (prev.some(t => t == null)) { prev.push(null); return; } // already out
    let t = ref * (d.pace + d.form) * (1 + (Math.random() + Math.random() + Math.random() - 1.5) * .014);
    const m = Math.random();
    if (m < .012) { prev.push(null); return; }                   // off the road and out of the rally
    if (m < .035) t += 25 + Math.random() * 60;                  // a big moment: stuck in a ditch
    else if (m < .12) t += 2 + Math.random() * 10;                // a spin, an overshoot
    prev.push(Math.round(t * 100) / 100);
  });
}

// standings after stage index si (inclusive): total time, or out
function rallyTable(si) {
  const R = SV.rally, rows = [];
  rows.push({ me: true, name: 'You', nat: '', car: R.car, stage: R.my[si], total: R.my.slice(0, si + 1).reduce((a, b) => a + b, 0) });
  R.rivals.forEach((d, i) => {
    const ts = R.times[i].slice(0, si + 1), out = ts.some(t => t == null);
    rows.push({ name: d.name, nat: d.nat, car: d.car, stage: R.times[i][si], total: out ? null : ts.reduce((a, b) => a + b, 0) });
  });
  return rows;
}
const byTime = k => (a, b) => (a[k] == null) - (b[k] == null) || (a[k] ?? 0) - (b[k] ?? 0);

// the player's stage result arrives here; returns the summary for the results screen
function rallyStageDone(time, ref, car) {
  const R = SV.rally, si = R.stage;
  R.my[si] = time; R.refs[si] = ref;
  rallyFieldTimes(ref);
  // damage goes with the car to the next stage, unless the service park is next
  const service = SERVICE_AFTER.includes(si);
  R.dm = service ? null : JSON.parse(JSON.stringify(car.dm)); R.dents = service ? [] : car.dents.slice();
  R.stage++;
  const stage = rallyTable(si).sort(byTime('stage')), overall = rallyTable(si).sort(byTime('total'));
  const pos = overall.findIndex(r => r.me) + 1, spos = stage.findIndex(r => r.me) + 1;
  let pay = 0;
  if (R.stage >= RALLY[R.id].stages.length) {
    R.done = true;
    pay = Math.round(((RALLY_PAY[pos - 1] || 800) * (1 + .3 * (RALLY[R.id].cls - 1))) / 10) * 10;
    SV.credits += pay;
    SV.rallyBest = SV.rallyBest || {};
    SV.rallyBest[R.id] = Math.min(SV.rallyBest[R.id] || 99, pos);
  }
  writeSave();
  return { si, stage, overall, pos, spos, service, pay, done: R.done, dmg: car.dmg, parts: damageList(car.dm) };
}

// projected rival time at a fraction of the stage, for live split comparisons
function rallyLeaderAt(frac) {
  const R = SV.rally, si = R.stage, ref = RACE && RACE.refT; if (!ref) return null;
  const best = Math.min(...R.rivals.map((d, i) => R.times[i].some(t => t == null) ? 1e9 : d.pace + d.form));
  return ref * best * frac;
}

function paintSwatch(canvas, biome) {
  const w = canvas.clientWidth || 260, h = canvas.clientHeight || 58, d = Math.min(2, devicePixelRatio || 1);
  canvas.width = w * d; canvas.height = h * d;

function paintCar(canvas, carId, liv, bg) {

  canvas.width = w * d; canvas.height = h * d;

      <div class="muted" style="margin:0">${c.need === 'release' ? 'Let the control return to rest.' : st.sub || 'Hold it until the bar fills.'}</div>
      <div class="bar"><b id="calprog" style="width:0%"></b></div>
      <div class="muted" id="caldet" style="margin:0;min-height:1.3em;font-family:var(--f-num);font-size:12px"></div>
      <div class="cols"><button class="ghostbtn" data-act="calskip">Skip</button><button class="back" data-act="calcancel">Cancel</button></div>`;
  },
  calTick(p, dt) {
    const c = this.cal, st = this.CAL_STEPS[c.step], prog = document.getElementById('calprog');
    if (st.k === 'rest') {
      // give the hands a moment to leave the controller (the button that started this may still be down)
      c.t += dt; if (prog) prog.style.width = Math.min(100, c.t / 1.3 * 100) + '%';
      if (c.t < .35) return;
      const snap = PAD.snapshot(p);
      if (!c.sum) c.sum = { ax: snap.ax.map(() => 0), bt: snap.bt.map(() => 0) };
      snap.ax.forEach((a, i) => c.sum.ax[i] += a); snap.bt.forEach((b, i) => c.sum.bt[i] += b); c.n++;
      if (c.t >= 1.3) { c.rest = { ax: c.sum.ax.map(v => v / c.n), bt: c.sum.bt.map(v => v / c.n) }; this.calNext(); }
      return;
    }
    const s = PAD.strongest(p, c.rest), det = document.getElementById('caldet');
    if (det) det.textContent = s && s.d > .15 ? `Detected: ${s.t === 'ax' ? 'axis ' + s.i + (s.val < s.rest ? ' −' : ' +') : 'button ' + s.i}  ·  ${Math.round(s.d * 100)}%` : 'Waiting for input…';
    if (c.need === 'release') { if (!s || s.d < .2) { c.need = 'press'; c.hold = 0; c.peak = null; this.calRender(); } return; }
    if (s && s.d > .45) {
      if (!c.peak || s.i !== c.peak.i || s.t !== c.peak.t || sign(s.val - s.rest) !== sign(c.peak.val - c.peak.rest)) { c.peak = s; c.hold = 0; }
      else { c.hold += dt; if (Math.abs(s.val - s.rest) > Math.abs(c.peak.val - c.peak.rest)) c.peak = s; }
      if (prog) prog.style.width = Math.min(100, c.hold / .35 * 100) + '%';
      if (c.hold > .35) { c.res[st.k] = c.peak; AUD.click(); this.calNext(); }
    } else { c.hold = 0; if (prog) prog.style.width = '0%'; }
  },
  calNext(skip) {
    const c = this.cal; if (!c) return;
    c.step++; c.t = 0; c.hold = 0; c.peak = null; c.need = c.step > 1 && !skip ? 'release' : 'press';
    if (c.step >= this.CAL_STEPS.length) return this.calFinish();
    this.calRender();
  },
  calFinish() {
    const p = PAD.active(), c = this.cal; if (!p || !c) return;
    const P = { ...PAD.profile(p) }, r = c.res;
    const uni = q => q && (q.t === 'ax' ? { t: 'ax', i: q.i, rest: q.rest, full: q.val } : { t: 'btn', i: q.i, rest: q.rest, full: Math.max(q.val, q.rest + .3) });
    if (r.left && r.right) P.steer = { t: 'pair', l: uni(r.left), r: uni(r.right) };
    if (r.gas) P.gas = uni(r.gas);
    if (r.brake) P.brake = uni(r.brake);
    if (r.hand) { P.hand = uni(r.hand); P.hand2 = null; }
    if (r.reset) P.reset = uni(r.reset);
    if (r.up) P.up = uni(r.up);
    if (r.down) P.down = uni(r.down);
    PAD.saveProfile(p, P); this.cal = null; toast('Calibration saved'); this.controllers();
  },

  pause() {
    this.set(`<div class="screen" style="background:rgba(16,12,26,.45)"><div class="overlay-center panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="eyebrow">${esc(RACE.ev.name)}</div><div class="h2">Paused</div>
      <div class="cols"><button class="cta" data-act="resume" data-focus>Resume</button>${FL.on ? '<button class="ghostbtn" data-act="flip">Flip screen</button>' : ''}${RACE.rally ? '<button class="ghostbtn" data-act="retire">Retire from stage</button>' : '<button class="ghostbtn" data-act="restart">Restart</button><button class="ghostbtn" data-act="quit">Leave stage</button>'}</div>
      ${RACE.rally ? '<p class="muted" style="margin:0">In a rally there are no restarts. Retiring books the stage at a heavy penalty time and the rally goes on.</p>' : ''}
      <div class="keys" style="margin-top:6px"><kbd>R</kbd><span>Reset to the road</span><kbd>G</kbd><span>Ghost ${SV.settings.ghost ? 'on' : 'off'}</span><kbd>Space</kbd><span>Handbrake</span></div>
    </div></div>`, () => togglePause(), {
      resume: () => togglePause(),
      flip: () => { setForceLand(true, FL.dir === 90 ? 270 : 90); },
      restart: () => { const r = RACE; quitRace(); startRace(r.ev, r.carId, r.tyre); },
      quit: () => { const ev = RACE.ev; quitRace(); this.prerace(ev); },
      retire: () => { const RC = RACE; RC.pen += Math.max(60, (RC.refT || 120) * .5); RC.t = Math.max(RC.t, (RC.refT || 120) * 1.1); RC.st = 'run'; AUD.ac && AUD.ac.resume(); this.close(); finishRace(); RC.finishT = 1.5; },
    });
  },

  results(r) {
    document.getElementById('hud').hidden = true; document.getElementById('touch').hidden = true;
    if (r.rally) return this.rallyStage(r);
    const ev = r.ev, next = !ev.free && CHAMPS.find(c => c.id === ev.champ).events[ev.idx + 1];
    const targets = r.targets ? `<div class="tlist">${[3, 2, 1].map(m => `<span>${medalDot(m)}</span><span>${MEDAL_NAMES[m]}</span><b>${fmtTime(r.targets[m - 1])}</b>`).join('')}</div>` : '';
    const splits = r.lapTimes.length ? `<div class="tlist">${r.lapTimes.map((t, i) => `<span>Lap ${i + 1}</span><span></span><b>${fmtTime(t)}</b>`).join('')}</div>` : '';
    const unlocks = r.fresh.map(c => `<div class="unlock"><canvas class="carview" style="width:120px;aspect-ratio:16/9" data-car="${c.id}" data-liv="${c.liv}"></canvas><div><div class="eyebrow">New car</div>${esc(c.make)} ${esc(c.model)}</div></div>`).join('')
      + (r.champDone ? `<div class="unlock"><div><div class="eyebrow">Championship complete</div>${esc(CHAMPS.find(c => c.id === ev.champ).name)}${CHAMPS[CHAMPS.findIndex(c => c.id === ev.champ) + 1] ? ' · next championship open' : ''}</div></div>` : '');
    const medalLine = ev.type === 'roam' ? `<div class="res-medal">All lanterns found</div>` : `<div class="res-medal">${medalDot(r.medal)} ${r.medal ? MEDAL_NAMES[r.medal] : 'No medal'}${r.isBest && r.prevBest ? ` · new best by ${(r.prevBest - r.time).toFixed(2)} s` : r.isBest ? ' · first finish' : ''}</div>`;
    this.set(`<div class="screen" style="background:linear-gradient(90deg,rgba(16,12,26,.62),rgba(16,12,26,.1))">
      <div style="margin:auto 0;display:flex;flex-direction:column;gap:18px;max-width:560px">
        <div class="eyebrow">${esc(ev.name)} · ${esc(CAR[RACE.carId].make)} ${esc(CAR[RACE.carId].model)}</div>
        <div class="res-time">${fmtTime(r.time)}</div>
        ${medalLine}
        <div class="cols" style="align-items:flex-start;gap:28px">${targets}${splits}${r.parts && r.parts.length ? `<div class="tlist">${r.parts.slice(0, 5).map(([n, v]) => `<span></span><span>${n}</span><b>${Math.round(v * 100)}%</b>`).join('')}</div>` : ''}</div>
        <div class="muted">+${r.pay.toLocaleString()} credits${r.resets ? ` · ${r.resets} reset${r.resets > 1 ? 's' : ''}` : ''}${r.dmg > .02 ? ` · car ${Math.round(r.dmg * 100)}% damaged` : ' · car clean'}</div>
        ${unlocks}
        <div class="cols">${next && eventOpen(next) ? `<button class="cta" data-act="next" data-focus>Next stage</button>` : ''}<button class="${next && eventOpen(next) ? 'ghostbtn' : 'cta'}" data-act="retry" ${next && eventOpen(next) ? '' : 'data-focus'}>Drive again</button><button class="ghostbtn" data-act="menu">${ev.free ? 'Free run' : 'Career'}</button></div>
      </div></div>`, null, {
      retry: () => { const R2 = RACE; quitRace(); startRace(R2.ev, R2.carId, R2.tyre); },
      next: () => { quitRace(); this.prerace(next); },
      menu: () => { quitRace(); ev.free ? this.free() : this.career(ev.champ); },
    });
  },

  loading(ev) {
    this.set(`<div class="screen"><div style="margin:auto 0 8vh;display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow">${esc(BIOMES[ev.biome].name)} · ${TYPES[ev.type].name} · ${CONDS[ev.cond].name}</div>
      <div class="brand" style="font-size:clamp(44px,8vw,110px)">${esc(ev.name)}</div>
      <div class="press" style="animation-duration:1.4s">Painting the stage</div></div></div>`);
  },
};

// ---------- rally screens: choose a rally, the service-park hub between stages, and the timing sheets ----------
Object.assign(UI, {
  rallies() {
    clearInterval(this.cyc); GAME.mode = 'menu';
    setBackdrop(RALLIES[0].stages[0].biome);
    const cards = RALLIES.map(r => {
      const ok = rallyOpen(r), best = SV.rallyBest && SV.rallyBest[r.id];
      return `<button class="card${ok ? '' : ' locked'}" data-act="${ok ? 'pick' : 'none'}" data-arg="${r.id}">
        <div class="swatch"><canvas data-swatch="${r.stages[0].biome}"></canvas></div>
        <div class="t">${esc(r.name)}</div>
        <div class="sub">${esc(CLASS_NAMES[r.cls])} class · ${r.stages.length} stages</div>
        <div class="row">${[...new Set(r.stages.map(s => s.surf))].map(k => chip(surfName(k), SURF_DOT[k])).join('')}</div>
        <div class="best">${best ? (best === 1 ? '🏆 Won' : 'Best finish P' + best) : ok ? 'Not entered yet' : 'Needs a ' + esc(CLASS_NAMES[r.cls]) + ' car'}</div>
      </button>`;
    }).join('');
    this.set(`<div class="screen">
      <div class="topbar"><button class="back" data-act="back">Back</button><span class="spacer"></span><span class="eyebrow">Credits ${SV.credits.toLocaleString()}</span></div>
      <h2 class="h2">Rally</h2>
      <p class="muted" style="margin:0 0 14px;max-width:720px">Five stages, one car, nine rival crews. Times add up across the rally, damage stays with the car until the service park after stages 2 and 4, and there are no restarts.</p>
      <div class="grid">${cards}</div>
    </div>`, () => this.main(), {
      back: () => this.main(), none: () => toast('Get a car of this class first'),
      pick: id => { if (SV.rally && !SV.rally.done && SV.rally.id !== id) return this.rallyAbandonAsk(() => this.rallyCar(id)); this.rallyCar(id); },
    });
  },

  rallyAbandonAsk(then) {
    this.set(`<div class="screen" style="background:rgba(16,12,26,.45)"><div class="overlay-center panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="eyebrow">${esc(RALLY[SV.rally.id].name)}</div><div class="h2">Abandon the rally?</div>
      <p class="muted" style="margin:0">You are on stage ${SV.rally.stage + 1}. Your times so far will be lost.</p>
      <div class="cols"><button class="ghostbtn" data-act="keep" data-focus>Keep going</button><button class="danger" data-act="drop">Abandon</button></div>
    </div></div>`, () => this.rallyHub(), { keep: () => this.rallyHub(), drop: () => { SV.rally = null; writeSave(); then(); } });
  },

  rallyCar(rid, sel) {
    const r = RALLY[rid], cars = CARS.filter(c => c.cls === r.cls && (SV.dev || SV.cars.includes(c.id)));
    sel = sel || (cars.find(c => c.id === this.lastCar) || cars[cars.length - 1] || {}).id;
    setBackdrop(r.stages[0].biome);
    const cards = cars.map(c => `<button class="card${c.id === sel ? ' sel' : ''}" data-act="car" data-arg="${c.id}" style="padding:10px">
        <canvas class="carview" style="aspect-ratio:16/8" data-car="${c.id}" data-liv="${livOf(c.id)}"></canvas>
        <div class="t" style="font-size:16px">${esc(c.make)} ${esc(c.model)}</div>
        <div class="sub">${c.year} · ${c.drive === 'A' ? 'AWD' : c.drive === 'R' ? 'RWD' : 'FWD'} · ${c.kw} kW</div></button>`).join('');
    const stages = r.stages.map((e, i) => `<div class="rst"><span class="ssn">SS${i + 1}</span><span>${esc(e.name)}</span><span class="row">${chip(surfName(e.surf), SURF_DOT[e.surf])}${chip(CONDS[e.cond].name, COND_DOT[e.cond])}</span></div>${SERVICE_AFTER.includes(i) ? '<div class="svc">Service park</div>' : ''}`).join('');
    this.set(`<div class="screen">
      <div class="topbar"><button class="back" data-act="back">Back</button><span class="spacer"></span><span class="eyebrow">${esc(CLASS_NAMES[r.cls])} class</span></div>
      <div class="two">
        <div class="panel" style="display:flex;flex-direction:column;gap:12px">
          <h2 class="h2" style="margin:0">${esc(r.name)}</h2><p class="muted" style="margin:0">${esc(r.blurb)}</p>
          <div class="rstages">${stages}</div>
          <div class="cols"><button class="cta" data-act="go" ${sel ? 'data-focus' : 'disabled'}>Enter the rally</button></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="eyebrow">Your car for the whole rally</div>
          <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${cards}</div></div>
      </div></div>`, () => this.rallies(), {
      back: () => this.rallies(), car: id => { this.lastCar = id; this.rallyCar(rid, id); },
      go: () => { if (!sel) return; rallyNew(rid, sel); this.rallyHub(); },
    });
  },

  rallyTableHtml(rows, key, si) {
    const lead = rows[0] && rows[0][key];
    return `<div class="rtab">${rows.map((r, i) => {
      const t = r[key], out = t == null;
      return `<span class="p${r.me ? ' me' : ''}">${out ? '–' : i + 1}</span><span class="${r.me ? 'me' : ''}">${esc(r.name)}${r.nat ? ` <i>${r.nat}</i>` : ''}<small>${esc(CAR[r.car].make + ' ' + CAR[r.car].model)}</small></span><b class="${r.me ? 'me' : ''}">${out ? 'Retired' : fmtTime(t)}</b><em>${out || i === 0 ? '' : '+' + (t - lead).toFixed(2)}</em>`;
    }).join('')}</div>`;
  },

  rallyHub() {
    clearInterval(this.cyc); GAME.mode = 'menu';
    const R = SV.rally; if (!R) return this.rallies();
    const r = RALLY[R.id], si = R.stage, next = r.stages[si];
    setBackdrop((next || r.stages[0]).biome);
    const stages = r.stages.map((e, i) => {
      let res = '';
      if (i < si) { const st = rallyTable(i).sort(byTime('stage')); res = `${fmtTime(R.my[i])} <small>P${st.findIndex(x => x.me) + 1}</small>`; }
      return `<div class="rst${i === si ? ' now' : ''}"><span class="ssn">SS${i + 1}</span><span>${esc(e.name)}</span><span class="row">${chip(surfName(e.surf), SURF_DOT[e.surf])}${chip(CONDS[e.cond].name, COND_DOT[e.cond])}</span><b>${res}</b></div>${SERVICE_AFTER.includes(i) && i < r.stages.length - 1 ? `<div class="svc">Service park${i < si ? (SERVICE_AFTER.includes(si - 1) ? ' · car repaired' : '') : ''}</div>` : ''}`;
    }).join('');
    const overall = si > 0 ? this.rallyTableHtml(rallyTable(si - 1).sort(byTime('total')), 'total') : '<p class="muted">Standings appear after the first stage.</p>';
    const rec = next ? SURF_TYRE[next.surf] || 'gravel' : 'gravel', tyre = this.rTyre && this.rTyreFor === si ? this.rTyre : rec;
    const tyreSeg = Object.keys(TYRES).map(k => `<button class="${k === tyre ? 'on' : ''}" data-act="tyre" data-arg="${k}">${TYRES[k].name}${k === rec ? ' ★' : ''}</button>`).join('');
    const dm = R.dm ? damageList(R.dm) : [];
    this.set(`<div class="screen">
      <div class="topbar"><button class="back" data-act="back">Main menu</button><span class="spacer"></span><span class="eyebrow">${esc(CAR[R.car].make)} ${esc(CAR[R.car].model)}</span></div>
      <div class="two">
        <div class="panel" style="display:flex;flex-direction:column;gap:12px">
          <div class="eyebrow">${esc(CLASS_NAMES[r.cls])} class</div><h2 class="h2" style="margin:0">${esc(r.name)}</h2>
          <div class="rstages">${stages}</div>
          ${dm.length ? `<div class="lockline">Carrying damage: ${dm.slice(0, 3).map(([n, v]) => `${n} ${Math.round(v * 100)}%`).join(' · ')}</div>` : ''}
          ${next ? `<div class="opt" style="border:0;padding:0"><div>Tyres for SS${si + 1}<small>★ suits this surface</small></div><div class="seg">${tyreSeg}</div></div>
          <div class="cols"><button class="cta" data-act="start" data-focus>Start SS${si + 1} · ${esc(next.name)}</button><button class="ghostbtn" data-act="abandon">Abandon rally</button></div>` : ''}
        </div>
        <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Overall standings${si > 0 ? ' after SS' + si : ''}</div>${overall}</div>
      </div></div>`, () => this.main(), {
      back: () => this.main(),
      tyre: k => { this.rTyre = k; this.rTyreFor = si; this.rallyHub(); },
      start: () => startRace(next, R.car, tyre),
      abandon: () => this.rallyAbandonAsk(() => this.rallies()),
    });
  },

  rallyStage(r) {
    const R = SV.rally, rl = RALLY[R.id];
    const head = r.done ? `<div class="eyebrow">${esc(rl.name)} · final classification</div><div class="res-time">${r.pos === 1 ? 'Rally winner' : 'P' + r.pos + ' overall'}</div>`
      : `<div class="eyebrow">${esc(rl.name)} · SS${r.si + 1} ${esc(r.ev.name)}</div><div class="res-time">${fmtTime(r.time)}</div><div class="res-medal">P${r.spos} on the stage · P${r.pos} overall</div>`;
    const dmg = r.parts && r.parts.length ? `<div class="muted">Damage: ${r.parts.slice(0, 4).map(([n, v]) => `${n} ${Math.round(v * 100)}%`).join(' · ')}${r.service ? ' · repaired at the service park' : ' · carried to the next stage'}</div>` : r.service && !r.done ? '<div class="muted">Service park next: the crew will check the car over.</div>' : '';
    this.set(`<div class="screen" style="background:linear-gradient(90deg,rgba(16,12,26,.7),rgba(16,12,26,.25))">
      <div style="margin:auto 0;display:flex;flex-direction:column;gap:16px;width:100%">
        ${head}
        <div class="two">
          <div class="panel"><div class="eyebrow" style="margin-bottom:10px">${r.done ? 'Final stage' : 'Stage'} times</div>${this.rallyTableHtml(r.stage, 'stage')}</div>
          <div class="panel"><div class="eyebrow" style="margin-bottom:10px">${r.done ? 'Final classification' : 'Overall standings'}</div>${this.rallyTableHtml(r.overall, 'total')}</div>
        </div>
        ${dmg}
        ${r.done ? `<div class="muted">+${r.pay.toLocaleString()} credits</div>` : ''}
        <div class="cols">${r.done ? '<button class="cta" data-act="out" data-focus>Rallies</button>' : `<button class="cta" data-act="hub" data-focus>${r.service ? 'To the service park' : 'Next stage'}</button>`}</div>
      </div></div>`, null, {
      hub: () => { quitRace(); this.rallyHub(); },
      out: () => { quitRace(); this.rallies(); },
    });
  },
});

// ---------- boot ----------
function boot() {
  loadSave();
  R.q = SV.settings.quality || 'high';
  initRender(); try { initGL(); } catch (e) { GL.ok = false; } try { initCarGL(); } catch (e) { CGL.ok = false; } UI.init(); bindTouch(); TILT.init();
  document.getElementById('rot-go').addEventListener('click', () => playSideways());
  document.getElementById('rot-flip').addEventListener('click', () => playSideways((TILT.gx || 0) > .3 ? 90 : 270));
  document.body.classList.toggle('no-tilt', !SV.settings.tilt);
  AUD.on = SV.settings.sound !== false; AUD.vol = SV.settings.vol || .7;
  document.getElementById('h-pause').addEventListener('click', () => togglePause());
  document.addEventListener('visibilitychange', () => { if (document.hidden && RACE && (RACE.st === 'run' || RACE.st === 'countdown')) togglePause(); });
  window.claude?.hot?.snapshot?.(() => ({ save: true }));
  UI.title();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();

</script>
